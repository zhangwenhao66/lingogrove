<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="system-ui, -apple-system, sans-serif">
	<rect width="800" height="340" fill="#f6f4e9"/>

	<!-- Row 1: periphrastic future, clustered near "now" -->
	<text x="48" y="56" fill="#201f1a" font-size="20" font-weight="700">Voy a llamar — periphrastic future</text>
	<line x1="48" y1="110" x2="752" y2="110" stroke="#ddd8c4" stroke-width="2"/>
	<circle cx="600" cy="110" r="7" fill="#2f6b47"/>
	<text x="600" y="140" text-anchor="middle" fill="#204a31" font-size="15" font-weight="600">voy a llamar</text>
	<text x="600" y="160" text-anchor="middle" fill="#5a5648" font-size="13">(a plan already in motion — spoken)</text>
	<line x1="48" y1="90" x2="48" y2="130" stroke="#ddd8c4" stroke-width="1"/>
	<text x="48" y="80" text-anchor="middle" fill="#8a8674" font-size="12">past</text>
	<line x1="752" y1="90" x2="752" y2="130" stroke="#ddd8c4" stroke-width="1"/>
	<text x="752" y="80" text-anchor="middle" fill="#8a8674" font-size="12">now</text>

	<!-- Row 2: simple future, spread across the line, plus a conjecture marker pinned at "now" -->
	<text x="48" y="220" fill="#201f1a" font-size="20" font-weight="700">Llamaré — simple future</text>
	<line x1="48" y1="274" x2="752" y2="274" stroke="#ddd8c4" stroke-width="2"/>
	<circle cx="420" cy="274" r="7" fill="#2f6b47"/>
	<text x="420" y="304" text-anchor="middle" fill="#204a31" font-size="15" font-weight="600">llamaré</text>
	<text x="420" y="324" text-anchor="middle" fill="#5a5648" font-size="13">(a promise or prediction — formal register)</text>
	<circle cx="752" cy="274" r="7" fill="#8a3b2e"/>
	<text x="700" y="304" text-anchor="middle" fill="#8a3b2e" font-size="15" font-weight="600">serán las tres</text>
	<text x="700" y="324" text-anchor="middle" fill="#8a3b2e" font-size="13">(conjecture — guessing about right now)</text>
</svg>
