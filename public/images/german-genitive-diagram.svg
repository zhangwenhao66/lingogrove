<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" font-family="system-ui, -apple-system, sans-serif">
	<rect width="800" height="900" fill="#f6f4e9"/>
	<rect x="24" y="24" width="752" height="852" rx="10" fill="#fffefa" stroke="#ddd8c4"/>

	<rect x="24" y="24" width="752" height="56" rx="10" fill="#2f6b47"/>
	<rect x="24" y="60" width="752" height="20" fill="#2f6b47"/>
	<text x="400" y="60" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">GERMAN GENITIVE: MARKED TWICE, ON THE ARTICLE AND THE NOUN</text>

	<!-- row 1: article + noun table -->
	<rect x="46" y="100" width="708" height="146" rx="8" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="400" y="124" text-anchor="middle" fill="#204a31" font-size="13" font-weight="700">DES / DER ON THE ARTICLE, PLUS -S OR -ES ON MASC./NEUT. NOUNS</text>

	<text x="132" y="150" text-anchor="middle" fill="#5a5648" font-size="11" font-weight="700">MASC.</text>
	<text x="309" y="150" text-anchor="middle" fill="#5a5648" font-size="11" font-weight="700">NEUT.</text>
	<text x="486" y="150" text-anchor="middle" fill="#5a5648" font-size="11" font-weight="700">FEM.</text>
	<text x="663" y="150" text-anchor="middle" fill="#5a5648" font-size="11" font-weight="700">PLURAL</text>
	<line x1="70" y1="160" x2="734" y2="160" stroke="#c8dcc9" stroke-width="1"/>

	<text x="132" y="188" text-anchor="middle" fill="#201f1a" font-size="14" font-weight="700">des Mannes</text>
	<text x="309" y="188" text-anchor="middle" fill="#201f1a" font-size="14" font-weight="700">des Kindes</text>
	<text x="486" y="188" text-anchor="middle" fill="#201f1a" font-size="14" font-weight="700">der Frau</text>
	<text x="663" y="188" text-anchor="middle" fill="#201f1a" font-size="14" font-weight="700">der Kinder</text>

	<text x="132" y="210" text-anchor="middle" fill="#5a5648" font-size="10.5">article + noun -es</text>
	<text x="309" y="210" text-anchor="middle" fill="#5a5648" font-size="10.5">article + noun -es</text>
	<text x="486" y="210" text-anchor="middle" fill="#5a5648" font-size="10.5">article only, noun unchanged</text>
	<text x="663" y="210" text-anchor="middle" fill="#5a5648" font-size="10.5">article only, noun unchanged</text>
	<text x="400" y="232" text-anchor="middle" fill="#5a5648" font-size="10.5" font-style="italic">Only masc./neut. singular nouns carry a second genitive marker of their own.</text>

	<!-- row 2: -s vs -es -->
	<rect x="46" y="262" width="708" height="150" rx="8" fill="#fbead0" stroke="#ddd8c4"/>
	<text x="400" y="286" text-anchor="middle" fill="#5a5648" font-size="13" font-weight="700">-S OR -ES? DUDEN'S RULE (Die Genitivregel / Genitiv auf -s oder -es)</text>

	<text x="70" y="310" fill="#201f1a" font-size="11" font-weight="700">-es only:</text>
	<text x="150" y="310" fill="#201f1a" font-size="11">after a sibilant (-ss, -z, -tz): des Hasses, des Satzes, des Glanzes</text>

	<text x="70" y="332" fill="#201f1a" font-size="11" font-weight="700">-s only:</text>
	<text x="150" y="332" fill="#201f1a" font-size="11">after -en, -em, -el, -er, or a diminutive: des Schwimmens, des Pegels, des Fahrers</text>

	<text x="70" y="354" fill="#201f1a" font-size="11" font-weight="700">-es preferred:</text>
	<text x="180" y="354" fill="#201f1a" font-size="11">genitive placed before its noun: des Tages Hitze, des Waldes K&#252;hle</text>

	<text x="70" y="376" fill="#201f1a" font-size="11" font-weight="700">-s preferred:</text>
	<text x="180" y="376" fill="#201f1a" font-size="11">unstressed final syllable, or after a vowel/vowel+h: des Abdrucks, des Schnees</text>

	<text x="400" y="400" text-anchor="middle" fill="#5a5648" font-size="10.5" font-style="italic">Many other one/two-syllable masc./neut. nouns allow either form; sentence rhythm decides.</text>

	<!-- row 3: seven weak nouns exception -->
	<rect x="46" y="428" width="708" height="140" rx="8" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="400" y="452" text-anchor="middle" fill="#204a31" font-size="13" font-weight="700">SEVEN NOUNS THAT BREAK THE PATTERN: -NS, NOT PLAIN -S</text>
	<text x="400" y="474" text-anchor="middle" fill="#201f1a" font-size="12">der Name &#8594; des Namens &#183; der Wille &#8594; des Willens &#183; der Glaube &#8594; des Glaubens</text>
	<text x="400" y="496" text-anchor="middle" fill="#201f1a" font-size="12">der Gedanke &#8594; des Gedankens &#183; der Buchstabe &#8594; des Buchstabens</text>
	<text x="400" y="518" text-anchor="middle" fill="#201f1a" font-size="12">der Friede &#8594; des Friedens &#183; der Funke &#8594; des Funkens</text>
	<text x="400" y="546" text-anchor="middle" fill="#5a5648" font-size="10.5" font-style="italic">Plus das Herz (neuter, not masculine): des Herzens, but the accusative stays "Herz."</text>

	<!-- row 4: Genitivregel visibility -->
	<rect x="46" y="580" width="708" height="150" rx="8" fill="#fbead0" stroke="#ddd8c4"/>
	<text x="400" y="604" text-anchor="middle" fill="#5a5648" font-size="13" font-weight="700">DUDEN'S THREE-PART GENITIVREGEL</text>

	<text x="70" y="628" fill="#201f1a" font-size="11" font-weight="700">Sichtbarkeitsregel:</text>
	<text x="220" y="628" fill="#201f1a" font-size="11">the case must be visible on some word in the phrase</text>

	<text x="70" y="650" fill="#201f1a" font-size="11" font-weight="700">s-Regel:</text>
	<text x="220" y="650" fill="#201f1a" font-size="11">a genitive-s noun can never stand alone, even though it IS genitive</text>

	<text x="70" y="672" fill="#201f1a" font-size="11" font-weight="700">Ersatzregel:</text>
	<text x="220" y="672" fill="#201f1a" font-size="11">with no companion word, swap in von + dative instead</text>

	<rect x="70" y="690" width="660" height="26" rx="4" fill="#fdeaea" stroke="#c99"/>
	<text x="400" y="707" text-anchor="middle" fill="#8a2e2e" font-size="11">&#10007; sich Problems annehmen: genitive, but no companion word, still wrong</text>

	<!-- row 5: prepositions + decline -->
	<rect x="46" y="742" width="708" height="118" rx="8" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="400" y="766" text-anchor="middle" fill="#204a31" font-size="13" font-weight="700">THE FOUR MOST-TAUGHT GENITIVE PREPOSITIONS (formal German keeps more: aufgrund, angesichts...)</text>
	<text x="400" y="790" text-anchor="middle" fill="#201f1a" font-size="13" font-weight="700">w&#228;hrend &#183; trotz &#183; wegen &#183; (an)statt</text>
	<text x="400" y="814" text-anchor="middle" fill="#5a5648" font-size="10.5">wegen increasingly takes the dative in casual speech (wegen dem Wetter), marked non-standard in formal writing</text>
	<text x="400" y="838" text-anchor="middle" fill="#5a5648" font-size="10.5" font-style="italic">Bastian Sick's bestseller "Der Dativ ist dem Genitiv sein Tod" names the trend, and its own title uses the dative construction it describes.</text>
</svg>
