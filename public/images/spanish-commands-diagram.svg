<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" font-family="system-ui, -apple-system, sans-serif">
	<rect width="800" height="760" fill="#f6f4e9"/>
	<rect x="24" y="24" width="752" height="712" rx="10" fill="#fffefa" stroke="#ddd8c4"/>

	<rect x="24" y="24" width="752" height="56" rx="10" fill="#2f6b47"/>
	<rect x="24" y="60" width="752" height="20" fill="#2f6b47"/>
	<text x="400" y="60" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">SPANISH COMMANDS: TWO SEPARATE SYSTEMS</text>

	<!-- row 1: tú exclusive vs everyone-else/negative subjunctive -->
	<rect x="46" y="102" width="345" height="128" rx="8" fill="#fbead0" stroke="#ddd8c4"/>
	<rect x="409" y="102" width="345" height="128" rx="8" fill="#fbead0" stroke="#ddd8c4"/>

	<text x="218" y="128" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">AFFIRMATIVE TÚ / VOSOTROS</text>
	<text x="218" y="128" dy="14" text-anchor="middle" fill="#5a5648" font-size="11">exclusive to the imperative</text>
	<text x="218" y="170" text-anchor="middle" fill="#2f6b47" font-size="17" font-weight="700">Habla. Hablad.</text>
	<text x="218" y="194" text-anchor="middle" fill="#201f1a" font-size="12" font-style="italic">&#8220;Habla m&#225;s despacio.&#8221;</text>
	<text x="218" y="214" text-anchor="middle" fill="#5a5648" font-size="11">this form exists nowhere else in the verb</text>

	<text x="581" y="128" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">USTED / USTEDES / NOSOTROS</text>
	<text x="581" y="128" dy="14" text-anchor="middle" fill="#5a5648" font-size="11">+ every negative command, any person</text>
	<text x="581" y="170" text-anchor="middle" fill="#2f6b47" font-size="17" font-weight="700">No hables. Hable.</text>
	<text x="581" y="194" text-anchor="middle" fill="#201f1a" font-size="12" font-style="italic">&#8220;No hables tan r&#225;pido.&#8221;</text>
	<text x="581" y="214" text-anchor="middle" fill="#5a5648" font-size="11">borrowed from the present subjunctive</text>

	<!-- row 2: eight irregular tú commands -->
	<rect x="46" y="248" width="708" height="180" rx="8" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="400" y="272" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">EIGHT AFFIRMATIVE TÚ COMMANDS DON&#8217;T FOLLOW THE REGULAR PATTERN</text>

	<text x="130" y="304" text-anchor="middle" fill="#204a31" font-size="13" font-weight="700">decir &#8594; di</text>
	<text x="130" y="324" text-anchor="middle" fill="#204a31" font-size="13" font-weight="700">hacer &#8594; haz</text>
	<text x="130" y="344" text-anchor="middle" fill="#204a31" font-size="13" font-weight="700">ir &#8594; ve</text>
	<text x="130" y="364" text-anchor="middle" fill="#204a31" font-size="13" font-weight="700">poner &#8594; pon</text>

	<text x="360" y="304" text-anchor="middle" fill="#204a31" font-size="13" font-weight="700">salir &#8594; sal</text>
	<text x="360" y="324" text-anchor="middle" fill="#204a31" font-size="13" font-weight="700">ser &#8594; s&#233;</text>
	<text x="360" y="344" text-anchor="middle" fill="#204a31" font-size="13" font-weight="700">tener &#8594; ten</text>
	<text x="360" y="364" text-anchor="middle" fill="#204a31" font-size="13" font-weight="700">venir &#8594; ven</text>

	<text x="620" y="304" text-anchor="middle" fill="#5a5648" font-size="12">regular rule would give:</text>
	<text x="620" y="324" text-anchor="middle" fill="#5a5648" font-size="12">tener &#8594; &#8220;tiene&#8221;</text>
	<text x="620" y="344" text-anchor="middle" fill="#5a5648" font-size="12">actual command:</text>
	<text x="620" y="364" text-anchor="middle" fill="#2f6b47" font-size="13" font-weight="700">ten</text>

	<line x1="70" y1="382" x2="734" y2="382" stroke="#c8dcc9" stroke-width="1"/>
	<text x="400" y="404" text-anchor="middle" fill="#5a5648" font-size="11" font-style="italic">Vosotros affirmative has no irregulars at all: decid, haced, id, poned, salid, sed, tened, venid all form regularly.</text>

	<!-- row 3: vamos exception and idos/iros -->
	<rect x="46" y="436" width="345" height="130" rx="8" fill="#fbead0" stroke="#ddd8c4"/>
	<rect x="409" y="436" width="345" height="130" rx="8" fill="#fbead0" stroke="#ddd8c4"/>

	<text x="218" y="462" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">NOSOTROS &#8220;LET&#8217;S GO&#8221;: THE ONE EXCEPTION</text>
	<text x="218" y="494" text-anchor="middle" fill="#2f6b47" font-size="16" font-weight="700">Vamos, not vayamos</text>
	<text x="218" y="518" text-anchor="middle" fill="#201f1a" font-size="11">expected subjunctive form: vayamos</text>
	<text x="218" y="538" text-anchor="middle" fill="#5a5648" font-size="11">vayamos still used for &#8220;no vayamos&#8221;</text>
	<text x="218" y="556" text-anchor="middle" fill="#5a5648" font-size="11">and inside subordinate clauses</text>

	<text x="581" y="462" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">VOSOTROS + REFLEXIVE: THE -D DROPS</text>
	<text x="581" y="494" text-anchor="middle" fill="#2f6b47" font-size="16" font-weight="700">Levantaos, poneos</text>
	<text x="581" y="518" text-anchor="middle" fill="#201f1a" font-size="11">irse&#8217;s exception: idos (formal)</text>
	<text x="581" y="538" text-anchor="middle" fill="#5a5648" font-size="11">iros (colloquial, valid since 2017)</text>
	<text x="581" y="556" text-anchor="middle" fill="#5a5648" font-size="11">regular rule would give &#8220;&#237;os&#8221;</text>

	<!-- row 4: negative doesn't exist -->
	<rect x="46" y="586" width="708" height="108" rx="8" fill="#fff4f4" stroke="#e0b8b8"/>
	<text x="400" y="614" text-anchor="middle" fill="#7a3f3f" font-size="12" font-weight="700">THE RAE&#8217;S OWN STATEMENT: THE IMPERATIVE ISN&#8217;T USED IN NEGATIVE FORM AT ALL</text>
	<text x="400" y="640" text-anchor="middle" fill="#201f1a" font-size="13" font-style="italic">&#8220;No comas. No coma. No comamos. No com&#225;is. No coman.&#8221;</text>
	<text x="400" y="664" text-anchor="middle" fill="#5a5648" font-size="11">every person, every negative command, all borrowed from the present subjunctive</text>

	<line x1="46" y1="712" x2="754" y2="712" stroke="#ddd8c4" stroke-width="1"/>
	<text x="400" y="736" text-anchor="middle" fill="#5a5648" font-size="12" font-style="italic">Object pronouns follow the same affirmative/negative split: attached after affirmative commands, in front of negative ones.</text>
</svg>
