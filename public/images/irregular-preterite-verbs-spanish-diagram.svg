<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, -apple-system, sans-serif">
	<rect width="900" height="460" fill="#f6f4e9"/>

	<rect x="24" y="24" width="272" height="412" rx="10" fill="#fffefa" stroke="#ddd8c4"/>
	<rect x="314" y="24" width="272" height="412" rx="10" fill="#fffefa" stroke="#ddd8c4"/>
	<rect x="604" y="24" width="272" height="412" rx="10" fill="#fffefa" stroke="#ddd8c4"/>

	<rect x="24" y="24" width="272" height="52" rx="10" fill="#2f6b47"/>
	<rect x="24" y="56" width="272" height="20" fill="#2f6b47"/>
	<text x="160" y="57" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">U-STEM</text>

	<rect x="314" y="24" width="272" height="52" rx="10" fill="#204a31"/>
	<rect x="314" y="56" width="272" height="20" fill="#204a31"/>
	<text x="450" y="57" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">I-STEM</text>

	<rect x="604" y="24" width="272" height="52" rx="10" fill="#16321f"/>
	<rect x="604" y="56" width="272" height="20" fill="#16321f"/>
	<text x="740" y="57" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">J-STEM</text>

	<g fill="#201f1a" font-size="15">
		<text x="44" y="112" font-weight="700">andar → anduv-</text>
		<text x="44" y="134" font-weight="700">estar → estuv-</text>
		<text x="44" y="156" font-weight="700">poder → pud-</text>
		<text x="44" y="178" font-weight="700">poner → pus-</text>
		<text x="44" y="200" font-weight="700">saber → sup-</text>
		<text x="44" y="222" font-weight="700">tener → tuv-</text>
		<text x="44" y="244" font-weight="700">haber → hub-</text>
		<text x="44" y="266" font-weight="700">caber → cup-</text>

		<text x="44" y="308" fill="#5a5648" font-size="14">Endings: -e -iste -o</text>
		<text x="44" y="328" fill="#5a5648" font-size="14">-imos -isteis -ieron</text>

		<text x="44" y="366" font-weight="700" font-size="14">Example</text>
		<text x="44" y="388" fill="#5a5648" font-size="14">estuve, estuviste, estuvo,</text>
		<text x="44" y="408" fill="#5a5648" font-size="14">estuvimos, estuvisteis,</text>
		<text x="44" y="428" fill="#5a5648" font-size="14">estuvieron</text>
	</g>

	<g fill="#201f1a" font-size="15">
		<text x="334" y="112" font-weight="700">hacer → hic-</text>
		<text x="334" y="134" font-weight="700">querer → quis-</text>
		<text x="334" y="156" font-weight="700">venir → vin-</text>

		<text x="334" y="188" fill="#5a5648" font-size="14">Endings: -e -iste -o</text>
		<text x="334" y="208" fill="#5a5648" font-size="14">-imos -isteis -ieron</text>
		<text x="334" y="232" fill="#a5401f" font-size="14">exception: hizo, not hico</text>
		<text x="334" y="252" fill="#5a5648" font-size="13">(c→z spelling only)</text>

		<text x="334" y="294" font-weight="700" font-size="14">Example</text>
		<text x="334" y="316" fill="#5a5648" font-size="14">hice, hiciste, hizo,</text>
		<text x="334" y="336" fill="#5a5648" font-size="14">hicimos, hicisteis,</text>
		<text x="334" y="356" fill="#5a5648" font-size="14">hicieron</text>
	</g>

	<g fill="#201f1a" font-size="15">
		<text x="624" y="112" font-weight="700">decir → dij-</text>
		<text x="624" y="134" font-weight="700">traer → traj-</text>
		<text x="624" y="156" font-weight="700">conducir → conduj-</text>
		<text x="624" y="178" font-weight="700">producir → produj-</text>

		<text x="624" y="210" fill="#5a5648" font-size="14">Endings: -e -iste -o</text>
		<text x="624" y="230" fill="#5a5648" font-size="14">-imos -isteis</text>
		<text x="624" y="252" fill="#a5401f" font-size="14">-eron, not -ieron</text>

		<text x="624" y="294" font-weight="700" font-size="14">Example</text>
		<text x="624" y="316" fill="#5a5648" font-size="14">dije, dijiste, dijo,</text>
		<text x="624" y="336" fill="#5a5648" font-size="14">dijimos, dijisteis,</text>
		<text x="624" y="356" fill="#a5401f" font-size="14">dijeron (not dijieron)</text>
	</g>

	<text x="450" y="450" text-anchor="middle" fill="#5a5648" font-size="13">All three families keep the same six endings — only the stem consonant/vowel and the j-stem ellos form differ.</text>
</svg>
