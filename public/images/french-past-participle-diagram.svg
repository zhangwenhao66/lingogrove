<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" font-family="system-ui, -apple-system, sans-serif">
	<rect width="800" height="760" fill="#f6f4e9"/>
	<rect x="24" y="24" width="752" height="712" rx="10" fill="#fffefa" stroke="#ddd8c4"/>

	<rect x="24" y="24" width="752" height="56" rx="10" fill="#2f6b47"/>
	<rect x="24" y="60" width="752" height="20" fill="#2f6b47"/>
	<text x="400" y="60" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">FRENCH PAST PARTICIPLE: TWO AUXILIARIES, TWO DIFFERENT RULES</text>

	<!-- row 1: formation -->
	<rect x="46" y="100" width="708" height="76" rx="8" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="400" y="122" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">FORMATION: ONLY TWO ENDINGS ARE "REGULAR" PER THE OQLF</text>
	<text x="400" y="146" text-anchor="middle" fill="#2f6b47" font-size="15" font-weight="700">aimer &#8594; aimé &#183; finir &#8594; fini — every &#8722;re and &#8722;oir verb is irregular</text>
	<text x="400" y="164" text-anchor="middle" fill="#201f1a" font-size="11">devoir &#8594; dû &#183; pouvoir &#8594; pu &#183; savoir &#8594; su &#183; vouloir &#8594; voulu</text>

	<!-- row 2: two auxiliary columns -->
	<rect x="46" y="192" width="345" height="128" rx="8" fill="#fbead0" stroke="#ddd8c4"/>
	<rect x="409" y="192" width="345" height="128" rx="8" fill="#fbead0" stroke="#ddd8c4"/>

	<text x="218" y="216" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">WITH AVOIR</text>
	<text x="218" y="240" text-anchor="middle" fill="#2f6b47" font-size="13" font-weight="700">Invariable by default</text>
	<text x="218" y="262" text-anchor="middle" fill="#201f1a" font-size="11">...unless a direct object</text>
	<text x="218" y="280" text-anchor="middle" fill="#201f1a" font-size="11">already sits before the verb:</text>
	<text x="218" y="300" text-anchor="middle" fill="#5a5648" font-size="11" font-style="italic">les lettres que j&#8217;ai écrites</text>

	<text x="581" y="216" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">WITH ÊTRE</text>
	<text x="581" y="240" text-anchor="middle" fill="#2f6b47" font-size="13" font-weight="700">Usually agrees with subject</text>
	<text x="581" y="262" text-anchor="middle" fill="#201f1a" font-size="11">Rachel est sortie.</text>
	<text x="581" y="280" text-anchor="middle" fill="#201f1a" font-size="11">Les étudiants ont été accusés.</text>
	<text x="581" y="300" text-anchor="middle" fill="#5a5648" font-size="11" font-style="italic">but not the pronominal case &#8594;</text>

	<!-- row 3: the etre exception -->
	<rect x="46" y="336" width="708" height="86" rx="8" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="400" y="358" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">ONE ÊTRE CASE BORROWS AVOIR&#8217;S RULE INSTEAD</text>
	<text x="400" y="382" text-anchor="middle" fill="#2f6b47" font-size="14" font-weight="700">Pronominal verbs (se laver, se parler...) still use être, but agree by the same COD test</text>
	<text x="400" y="404" text-anchor="middle" fill="#201f1a" font-size="11">elle s&#8217;est lavée agrees; elle s&#8217;est lavé les mains does not — se vs. les mains as the direct object</text>

	<!-- row 4: du vs du -->
	<rect x="46" y="440" width="708" height="118" rx="8" fill="#fbead0" stroke="#ddd8c4"/>
	<text x="400" y="464" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">THE CIRCUMFLEX THAT ONLY SURVIVES IN ONE FORM</text>
	<text x="400" y="490" text-anchor="middle" fill="#2f6b47" font-size="15" font-weight="700">dû (masc. sing.) &#8212; due &#183; dus &#183; dues (no accent)</text>
	<text x="400" y="514" text-anchor="middle" fill="#201f1a" font-size="11">Le montant est dû. &#183; La panne est due à un court-circuit. &#183; Beaucoup d&#8217;accidents sont dus à la fatigue.</text>
	<text x="400" y="536" text-anchor="middle" fill="#5a5648" font-size="11">kept specifically to stay distinct from &#8220;du,&#8221; the article — de + le</text>

	<line x1="46" y1="578" x2="754" y2="578" stroke="#ddd8c4" stroke-width="1"/>
	<text x="400" y="604" text-anchor="middle" fill="#5a5648" font-size="12" font-style="italic">"Regular" here is an OQLF classification, not a promise every &#8722;re verb behaves alike:</text>
	<text x="400" y="624" text-anchor="middle" fill="#5a5648" font-size="12" font-style="italic">vendu and perdu follow a predictable pattern; pris and bu don&#8217;t.</text>

	<rect x="46" y="646" width="708" height="70" rx="8" fill="#f6f4e9" stroke="#ddd8c4"/>
	<text x="400" y="670" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">AND ALLER, DESPITE BEING GRAMMATICALLY IRREGULAR EVERYWHERE ELSE</text>
	<text x="400" y="694" text-anchor="middle" fill="#201f1a" font-size="12">still forms its participle on the regular &#8722;é pattern: aller &#8594; allé</text>
</svg>
