<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
	<rect width="800" height="400" fill="#f6f4e9"/>

	<text x="40" y="52" fill="#201f1a" font-size="21" font-weight="700">Three layers of the French past</text>
	<text x="40" y="78" fill="#5c594d" font-size="14">Each form points to a different distance behind the moment being talked about.</text>

	<!-- timeline -->
	<line x1="60" y1="210" x2="740" y2="210" stroke="#201f1a" stroke-width="2"/>
	<text x="700" y="238" fill="#201f1a" font-size="14" font-weight="700">now</text>

	<!-- plus-que-parfait marker (furthest back) -->
	<circle cx="150" cy="210" r="7" fill="#8a5a2b"/>
	<line x1="150" y1="203" x2="150" y2="150" stroke="#8a5a2b" stroke-width="2"/>
	<text x="150" y="140" fill="#8a5a2b" font-size="15" font-weight="700" text-anchor="middle">plus-que-parfait</text>
	<text x="150" y="122" fill="#5c594d" font-size="13" text-anchor="middle">j'avais fini</text>
	<text x="150" y="270" fill="#5c594d" font-size="13" text-anchor="middle">already done</text>
	<text x="150" y="288" fill="#5c594d" font-size="13" text-anchor="middle">before the next event</text>

	<!-- passe compose marker (later past event) -->
	<circle cx="420" cy="210" r="7" fill="#2f5d50"/>
	<line x1="420" y1="203" x2="420" y2="150" stroke="#2f5d50" stroke-width="2"/>
	<text x="420" y="140" fill="#2f5d50" font-size="15" font-weight="700" text-anchor="middle">passé composé</text>
	<text x="420" y="122" fill="#5c594d" font-size="13" text-anchor="middle">je suis arrivé</text>
	<text x="420" y="270" fill="#5c594d" font-size="13" text-anchor="middle">the later event</text>
	<text x="420" y="288" fill="#5c594d" font-size="13" text-anchor="middle">used as the reference point</text>

	<!-- imparfait band (background) -->
	<rect x="210" y="196" width="380" height="28" rx="4" fill="#c9a227" opacity="0.28"/>
	<text x="400" y="215" fill="#7a6212" font-size="13" text-anchor="middle">imparfait: what was going on in the background</text>

	<!-- reference arrow -->
	<path d="M160 210 L410 210" stroke="#8a5a2b" stroke-width="1.5" stroke-dasharray="5 4"/>
	<text x="285" y="180" fill="#8a5a2b" font-size="13" text-anchor="middle">earlier</text>

	<!-- auxiliary reminder -->
	<text x="40" y="340" fill="#201f1a" font-size="14" font-weight="700">Auxiliary in the imparfait</text>
	<text x="40" y="364" fill="#5c594d" font-size="14">avoir: j'avais, tu avais, il avait, nous avions, vous aviez, ils avaient</text>
	<text x="40" y="386" fill="#5c594d" font-size="14">être: j'étais, tu étais, il était, nous étions, vous étiez, ils étaient</text>
</svg>
