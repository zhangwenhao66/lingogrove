<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="system-ui, -apple-system, sans-serif">
	<rect width="800" height="700" fill="#f6f4e9"/>
	<rect x="24" y="24" width="752" height="652" rx="10" fill="#fffefa" stroke="#ddd8c4"/>

	<rect x="24" y="24" width="752" height="56" rx="10" fill="#2f6b47"/>
	<rect x="24" y="60" width="752" height="20" fill="#2f6b47"/>
	<text x="400" y="60" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">TWO ENDING PATTERNS COVER EVERY REGULAR VERB</text>

	<!-- -AR column -->
	<rect x="42" y="98" width="352" height="270" rx="8" fill="#fbead0" stroke="#ddd8c4"/>
	<text x="218" y="124" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">-AR VERBS · hablar</text>

	<text x="62" y="152" fill="#201f1a" font-size="13">yo</text>
	<text x="330" y="152" text-anchor="end" fill="#201f1a" font-size="14" font-weight="600">hablaba</text>

	<text x="62" y="178" fill="#201f1a" font-size="13">tú</text>
	<text x="330" y="178" text-anchor="end" fill="#201f1a" font-size="14" font-weight="600">hablabas</text>

	<text x="62" y="204" fill="#201f1a" font-size="13">él/ella/usted</text>
	<text x="330" y="204" text-anchor="end" fill="#201f1a" font-size="14" font-weight="600">hablaba</text>

	<rect x="52" y="218" width="332" height="30" rx="5" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="62" y="238" fill="#204a31" font-size="13">nosotros</text>
	<text x="330" y="238" text-anchor="end" fill="#204a31" font-size="14" font-weight="700">habl<tspan fill="#b5570f">á</tspan>bamos</text>

	<text x="62" y="264" fill="#201f1a" font-size="13">vosotros</text>
	<text x="330" y="264" text-anchor="end" fill="#201f1a" font-size="14" font-weight="600">hablabais</text>

	<text x="62" y="290" fill="#201f1a" font-size="13">ellos/ustedes</text>
	<text x="330" y="290" text-anchor="end" fill="#201f1a" font-size="14" font-weight="600">hablaban</text>

	<line x1="62" y1="306" x2="374" y2="306" stroke="#ddd8c4" stroke-width="1"/>
	<text x="218" y="326" text-anchor="middle" fill="#5a5648" font-size="10.5">only the nosotros form is esdrújula</text>
	<text x="218" y="342" text-anchor="middle" fill="#b5570f" font-size="10.5" font-style="italic">→ one tilde: -ábamos</text>
	<text x="218" y="358" text-anchor="middle" fill="#5a5648" font-size="10">every other form: no tilde</text>

	<!-- -ER/-IR column -->
	<rect x="406" y="98" width="352" height="270" rx="8" fill="#fbead0" stroke="#ddd8c4"/>
	<text x="582" y="124" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">-ER / -IR VERBS · comer, vivir</text>

	<rect x="416" y="138" width="332" height="26" rx="5" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="426" y="156" fill="#204a31" font-size="13">yo</text>
	<text x="738" y="156" text-anchor="end" fill="#204a31" font-size="14" font-weight="700">com<tspan fill="#b5570f">í</tspan>a</text>

	<rect x="416" y="168" width="332" height="26" rx="5" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="426" y="186" fill="#204a31" font-size="13">tú</text>
	<text x="738" y="186" text-anchor="end" fill="#204a31" font-size="14" font-weight="700">com<tspan fill="#b5570f">í</tspan>as</text>

	<rect x="416" y="198" width="332" height="26" rx="5" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="426" y="216" fill="#204a31" font-size="13">él/ella/usted</text>
	<text x="738" y="216" text-anchor="end" fill="#204a31" font-size="14" font-weight="700">com<tspan fill="#b5570f">í</tspan>a</text>

	<rect x="416" y="228" width="332" height="26" rx="5" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="426" y="246" fill="#204a31" font-size="13">nosotros</text>
	<text x="738" y="246" text-anchor="end" fill="#204a31" font-size="14" font-weight="700">com<tspan fill="#b5570f">í</tspan>amos</text>

	<rect x="416" y="258" width="332" height="26" rx="5" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="426" y="276" fill="#204a31" font-size="13">vosotros</text>
	<text x="738" y="276" text-anchor="end" fill="#204a31" font-size="14" font-weight="700">com<tspan fill="#b5570f">í</tspan>ais</text>

	<rect x="416" y="288" width="332" height="26" rx="5" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="426" y="306" fill="#204a31" font-size="13">ellos/ustedes</text>
	<text x="738" y="306" text-anchor="end" fill="#204a31" font-size="14" font-weight="700">com<tspan fill="#b5570f">í</tspan>an</text>

	<line x1="426" y1="322" x2="738" y2="322" stroke="#ddd8c4" stroke-width="1"/>
	<text x="582" y="340" text-anchor="middle" fill="#5a5648" font-size="10.5">stressed í next to a is a hiato</text>
	<text x="582" y="356" text-anchor="middle" fill="#b5570f" font-size="10.5" font-style="italic">→ tilde on every single form</text>

	<!-- irregulars section -->
	<rect x="24" y="392" width="752" height="40" fill="#2f6b47"/>
	<text x="400" y="418" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">ONLY THREE VERBS BREAK THE PATTERN</text>

	<rect x="42" y="448" width="228" height="130" rx="8" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="156" y="474" text-anchor="middle" fill="#204a31" font-size="14" font-weight="700">ir → iba</text>
	<text x="156" y="496" text-anchor="middle" fill="#5a5648" font-size="10.5">iba, ibas, iba,</text>
	<text x="156" y="512" text-anchor="middle" fill="#5a5648" font-size="10.5">íbamos, ibais, iban</text>
	<text x="156" y="540" text-anchor="middle" fill="#b5570f" font-size="10" font-style="italic">fully irregular</text>
	<text x="156" y="558" text-anchor="middle" fill="#5a5648" font-size="10">stem doesn't reduce</text>

	<rect x="286" y="448" width="228" height="130" rx="8" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="400" y="474" text-anchor="middle" fill="#204a31" font-size="14" font-weight="700">ser → era</text>
	<text x="400" y="496" text-anchor="middle" fill="#5a5648" font-size="10.5">era, eras, era,</text>
	<text x="400" y="512" text-anchor="middle" fill="#5a5648" font-size="10.5">éramos, erais, eran</text>
	<text x="400" y="540" text-anchor="middle" fill="#b5570f" font-size="10" font-style="italic">fully irregular</text>
	<text x="400" y="558" text-anchor="middle" fill="#5a5648" font-size="10">no -aba, no -ía</text>

	<rect x="530" y="448" width="228" height="130" rx="8" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="644" y="474" text-anchor="middle" fill="#204a31" font-size="14" font-weight="700">ver → veía</text>
	<text x="644" y="496" text-anchor="middle" fill="#5a5648" font-size="10.5">veía, veías, veía,</text>
	<text x="644" y="512" text-anchor="middle" fill="#5a5648" font-size="10.5">veíamos, veíais, veían</text>
	<text x="644" y="540" text-anchor="middle" fill="#b5570f" font-size="10" font-style="italic">barely irregular</text>
	<text x="644" y="558" text-anchor="middle" fill="#5a5648" font-size="10">keeps the e, regular -ía endings</text>

	<line x1="42" y1="604" x2="758" y2="604" stroke="#ddd8c4" stroke-width="1"/>
	<text x="400" y="630" text-anchor="middle" fill="#5a5648" font-size="11.5" font-style="italic">Orange marks the written accent. Every other Spanish verb, regular or irregular in other tenses, follows the two patterns above without exception in the imperfect.</text>
	<text x="400" y="654" text-anchor="middle" fill="#5a5648" font-size="11">Voseo doesn't change any of this: vos uses the same imperfect forms as tú, unlike the present tense.</text>
</svg>
