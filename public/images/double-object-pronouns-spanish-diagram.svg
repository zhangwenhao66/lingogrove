<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, sans-serif">
	<rect width="800" height="460" fill="#f6f4e9"/>
	<rect x="24" y="24" width="752" height="412" rx="10" fill="#fffefa" stroke="#ddd8c4"/>

	<rect x="24" y="24" width="752" height="56" rx="10" fill="#2f6b47"/>
	<rect x="24" y="60" width="752" height="20" fill="#2f6b47"/>
	<text x="400" y="60" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">DOUBLE OBJECT PRONOUN ORDER</text>

	<!-- three ranked steps -->
	<rect x="46" y="102" width="214" height="120" rx="8" fill="#fbead0" stroke="#ddd8c4"/>
	<rect x="293" y="102" width="214" height="120" rx="8" fill="#fbead0" stroke="#ddd8c4"/>
	<rect x="540" y="102" width="214" height="120" rx="8" fill="#fbead0" stroke="#ddd8c4"/>

	<text x="153" y="130" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">RANK 1</text>
	<text x="153" y="165" text-anchor="middle" fill="#2f6b47" font-size="26" font-weight="700">se</text>
	<text x="153" y="190" text-anchor="middle" fill="#201f1a" font-size="12">always first —</text>
	<text x="153" y="207" text-anchor="middle" fill="#201f1a" font-size="12">replaces le/les</text>

	<text x="400" y="130" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">RANK 2</text>
	<text x="400" y="163" text-anchor="middle" fill="#204a31" font-size="18" font-weight="700">2nd &gt; 1st &gt; 3rd</text>
	<text x="400" y="190" text-anchor="middle" fill="#201f1a" font-size="12">te / me / le,lo</text>
	<text x="400" y="207" text-anchor="middle" fill="#201f1a" font-size="12">by grammatical person</text>

	<text x="647" y="130" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">RANK 3</text>
	<text x="647" y="163" text-anchor="middle" fill="#204a31" font-size="16" font-weight="700">dative &gt; accusative</text>
	<text x="647" y="190" text-anchor="middle" fill="#201f1a" font-size="12">recipient before</text>
	<text x="647" y="207" text-anchor="middle" fill="#201f1a" font-size="12">the thing itself</text>

	<text x="273" y="168" text-anchor="middle" fill="#b5570f" font-size="20" font-weight="700">→</text>
	<text x="520" y="168" text-anchor="middle" fill="#b5570f" font-size="20" font-weight="700">→</text>

	<line x1="46" y1="248" x2="754" y2="248" stroke="#ddd8c4" stroke-width="1"/>

	<!-- worked example -->
	<text x="400" y="280" text-anchor="middle" fill="#5a5648" font-size="13" font-weight="700">WORKED EXAMPLE</text>

	<text x="400" y="312" text-anchor="middle" fill="#201f1a" font-size="16">Le doy el libro a María.</text>
	<text x="400" y="336" text-anchor="middle" fill="#5a5648" font-size="12" font-style="italic">el libro → lo, and le can't sit in front of lo</text>

	<text x="400" y="370" text-anchor="middle" fill="#b5570f" font-size="22" font-weight="700">↓</text>

	<rect x="270" y="382" width="260" height="46" rx="8" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="400" y="411" text-anchor="middle" fill="#2f6b47" font-size="22" font-weight="700">Se lo doy.</text>

	<text x="400" y="448" text-anchor="middle" fill="#5a5648" font-size="12" font-style="italic">se (rank 1) — lo (rank 3, accusative) — never "le lo"</text>
</svg>
