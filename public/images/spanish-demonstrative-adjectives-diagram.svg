<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
	<rect width="800" height="520" fill="#f6f4e9"/>
	<rect x="24" y="24" width="752" height="472" rx="10" fill="#fffefa" stroke="#ddd8c4"/>

	<rect x="24" y="24" width="752" height="56" rx="10" fill="#2f6b47"/>
	<rect x="24" y="60" width="752" height="20" fill="#2f6b47"/>
	<text x="400" y="60" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">THREE POINTS ON A LINE: ESTE, ESE, AQUEL</text>

	<!-- row 1: distance line with three markers -->
	<line x1="90" y1="150" x2="710" y2="150" stroke="#ddd8c4" stroke-width="3"/>
	<circle cx="130" cy="150" r="8" fill="#b5570f"/>
	<circle cx="400" cy="150" r="8" fill="#5a5648"/>
	<circle cx="670" cy="150" r="8" fill="#204a31"/>

	<text x="130" y="128" text-anchor="middle" fill="#b5570f" font-size="14" font-weight="700">ESTE</text>
	<text x="130" y="176" text-anchor="middle" fill="#201f1a" font-size="11">near speaker</text>
	<text x="400" y="128" text-anchor="middle" fill="#5a5648" font-size="14" font-weight="700">ESE</text>
	<text x="400" y="176" text-anchor="middle" fill="#201f1a" font-size="11">near listener / unmarked</text>
	<text x="670" y="128" text-anchor="middle" fill="#204a31" font-size="14" font-weight="700">AQUEL</text>
	<text x="670" y="176" text-anchor="middle" fill="#201f1a" font-size="11">far from both</text>

	<!-- row 2: full paradigm boxes -->
	<rect x="46" y="204" width="216" height="96" rx="8" fill="#fbead0" stroke="#ddd8c4"/>
	<rect x="292" y="204" width="216" height="96" rx="8" fill="#f0eee2" stroke="#ddd8c4"/>
	<rect x="538" y="204" width="216" height="96" rx="8" fill="#eaf1ea" stroke="#2f6b47"/>

	<text x="154" y="228" text-anchor="middle" fill="#b5570f" font-size="12" font-weight="700">este / esta</text>
	<text x="154" y="248" text-anchor="middle" fill="#b5570f" font-size="12" font-weight="700">estos / estas</text>
	<text x="154" y="272" text-anchor="middle" fill="#5a5648" font-size="10" font-style="italic">este libro (this book)</text>

	<text x="400" y="228" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">ese / esa</text>
	<text x="400" y="248" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">esos / esas</text>
	<text x="400" y="272" text-anchor="middle" fill="#5a5648" font-size="10" font-style="italic">ese libro (that book)</text>

	<text x="646" y="228" text-anchor="middle" fill="#204a31" font-size="12" font-weight="700">aquel / aquella</text>
	<text x="646" y="248" text-anchor="middle" fill="#204a31" font-size="12" font-weight="700">aquellos / aquellas</text>
	<text x="646" y="272" text-anchor="middle" fill="#5a5648" font-size="10" font-style="italic">aquel libro (that book, far off)</text>

	<!-- row 3: regional split -->
	<rect x="46" y="320" width="708" height="80" rx="8" fill="#fbead0" stroke="#ddd8c4"/>
	<text x="400" y="344" text-anchor="middle" fill="#5a5648" font-size="12" font-weight="700">MUCH OF LATIN AMERICA: THE SYSTEM COLLAPSES TO TWO</text>
	<text x="400" y="368" text-anchor="middle" fill="#b5570f" font-size="13" font-weight="700">este / acá (near) — ese / allá (far)</text>
	<text x="400" y="388" text-anchor="middle" fill="#201f1a" font-size="11" font-style="italic">aquel survives mainly in literary or evocative use</text>

	<!-- row 4: neuter footer -->
	<rect x="46" y="416" width="708" height="60" rx="8" fill="#eaf1ea" stroke="#2f6b47"/>
	<text x="400" y="440" text-anchor="middle" fill="#204a31" font-size="12" font-weight="700">esto · eso · aquello — no gender, no plural, never a person</text>
	<text x="400" y="460" text-anchor="middle" fill="#5a5648" font-size="11">the neuter set points at things, ideas, or situations that have no noun to agree with</text>
</svg>
